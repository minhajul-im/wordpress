services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp_user
      MARIADB_PASSWORD: wp_dev_password_change_me
      MARIADB_ROOT_PASSWORD: root_dev_password_change_me
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.4-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_dev_password_change_me
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress-files:/var/www/html
      - ./plugins/simple-calculator:/var/www/html/wp-content/plugins/simple-calculator #specific plugin folder, uncomment if you want to use it
      # - ./plugins:/var/www/html/wp-content/plugins (whole plugins folder, uncomment if you want to use it)

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306

volumes:
  db_data:
